<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developers · Thebes AI Growth Program</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="container nav-inner"><a href="/"><img class="logo" src="/assets/thebes-logo.png" alt="Thebes Ads"></a><nav class="nav-links"><span>Admin · <b data-user-name></b></span><button class="btn btn-outline" onclick="Thebes.logout()">Log out</button></nav></div></header><div class="app-layout"><aside class="sidebar"><div class="side-label">ADMIN PANEL</div><a class="side-link" href="/admin.html">▣ Applications</a><a class="side-link active" href="/admin-developers.html">◉ Developers</a><a class="side-link" href="/">⌂ Public Program</a></aside><main class="main"><div class="page-head"><div><h1>Developers</h1><p>All registered developers, companies and email verification status.</p></div></div><div class="success"></div><div class="error"></div><div class="stats stats-4" id="developerStats"></div><section class="glass card"><div class="filters"><input id="search" class="input" placeholder="Search name, company, email or country"><select id="verification" class="select"><option value="">All verification</option><option value="verified">Verified</option><option value="pending">Pending</option></select></div><div class="table-wrap"><table class="table developer-table"><thead><tr><th>Name</th><th>Company</th><th>Work Email</th><th>Country</th><th>Verification</th><th>Apps</th><th>Joined</th><th>Action</th></tr></thead><tbody id="developerRows"></tbody></table></div></section></main></div><script src="/config.js"></script><script src="/app.js"></script><script>
let developers=[];
function verificationBadge(d){return d.email_verified_at?'<span class="badge verified">Verified</span>':'<span class="badge pending">Pending</span>'}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const v=document.getElementById('verification').value;const filtered=developers.filter(d=>{const hay=[d.full_name,d.company_name,d.email,d.country].join(' ').toLowerCase();const verified=!!d.email_verified_at;return(!q||hay.includes(q))&&(!v||(v==='verified'&&verified)||(v==='pending'&&!verified))});document.getElementById('developerRows').innerHTML=filtered.length?filtered.map(d=>`<tr><td><strong>${Thebes.escapeHtml(d.full_name||'—')}</strong></td><td>${Thebes.escapeHtml(d.company_name||'—')}</td><td>${Thebes.escapeHtml(d.email)}</td><td>${Thebes.escapeHtml(d.country||'—')}</td><td>${verificationBadge(d)}${d.email_verified_at?`<div class="hint">${new Date(d.email_verified_at).toLocaleString()}</div>`:''}</td><td>${Number(d.application_count||0)}</td><td>${new Date(d.created_at).toLocaleDateString()}</td><td><div class="row-actions"><a class="btn btn-ghost btn-small" href="/admin-developer.html?id=${d.id}">View</a>${!d.email_verified_at?`<button class="btn btn-outline btn-small resend" data-id="${d.id}" data-email="${Thebes.escapeHtml(d.email)}">Resend</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="8"><div class="empty compact">No developers match these filters.</div></td></tr>';document.querySelectorAll('.resend').forEach(btn=>btn.onclick=()=>resend(btn))}
async function resend(btn){const email=btn.dataset.email;if(!confirm(`Resend verification email to ${email}?`))return;btn.disabled=true;const old=btn.textContent;btn.textContent='Sending…';try{await Thebes.api('/admin/developers/resend-verification.php',{method:'POST',body:JSON.stringify({user_id:btn.dataset.id})});Thebes.showMessage('success',`Verification email resent to ${email}.`)}catch(e){Thebes.showMessage('error',e.message)}finally{btn.disabled=false;btn.textContent=old}}
(async()=>{await Thebes.requireUser('admin');const d=await Thebes.api('/admin/developers/index.php');developers=d.developers||[];const verified=developers.filter(x=>x.email_verified_at).length;const pending=developers.length-verified;const withApps=developers.filter(x=>Number(x.application_count||0)>0).length;document.getElementById('developerStats').innerHTML=[['Developers',developers.length],['Verified',verified],['Pending',pending],['With Applications',withApps]].map(([l,n])=>`<div class="glass stat"><b>${n}</b><span>${l}</span></div>`).join('');render()})();document.getElementById('search').oninput=render;document.getElementById('verification').onchange=render;
</script></body></html>
