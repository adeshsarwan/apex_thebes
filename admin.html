<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Thebes AI Growth Program</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="container nav-inner"><a href="/"><img class="logo" src="/assets/thebes-logo.png"></a><nav class="nav-links"><span>Admin · <b data-user-name></b></span><button class="btn btn-outline" onclick="Thebes.logout()">Log out</button></nav></div></header><div class="app-layout"><aside class="sidebar"><div class="side-label">ADMIN PANEL</div><a class="side-link active" href="/admin.html">▣ Dashboard</a><a class="side-link" href="/admin.html">◫ Applications</a><a class="side-link" href="/">⌂ Public Program</a></aside><main class="main"><div class="page-head"><div><h1>Applications</h1><p>Review and select AI apps submitted to the program.</p></div></div><div class="stats" id="stats"></div><section class="glass card"><div class="filters"><input id="search" class="input" placeholder="Search app or company"><select id="status" class="select"><option value="">All statuses</option><option>Submitted</option><option>Under Review</option><option>More Info</option><option>Selected</option><option>Not Selected</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>App</th><th>Developer</th><th>Platform</th><th>Submitted</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script src="/config.js"></script><script src="/app.js"></script><script>
let all=[];function render(){const q=document.getElementById('search').value.toLowerCase();const s=document.getElementById('status').value;const rows=all.filter(a=>(!s||a.status===s)&&(!q||(a.app_name+a.company_name+a.email).toLowerCase().includes(q)));document.getElementById('rows').innerHTML=rows.map(a=>`<tr><td><strong>${Thebes.escapeHtml(a.app_name)}</strong><div class="hint">${Thebes.escapeHtml(a.category)}</div></td><td>${Thebes.escapeHtml(a.company_name)}<div class="hint">${Thebes.escapeHtml(a.email)}</div></td><td>${Thebes.escapeHtml(a.platform)}</td><td>${new Date(a.submitted_at||a.created_at).toLocaleDateString()}</td><td><span class="badge ${Thebes.statusClass(a.status)}">${Thebes.escapeHtml(a.status)}</span></td><td><a class="btn btn-ghost" href="/admin-application.html?id=${a.id}">Review</a></td></tr>`).join('')}
(async()=>{await Thebes.requireUser('admin');const d=await Thebes.api('/admin/applications/index.php');all=d.applications;const c=k=>all.filter(a=>a.status===k).length;document.getElementById('stats').innerHTML=[['Total',all.length],['Under Review',c('Under Review')],['Selected',c('Selected')],['Not Selected',c('Not Selected')],['More Info',c('More Info')]].map(([l,n])=>`<div class="glass stat"><b>${n}</b><span>${l}</span></div>`).join('');render()})();document.getElementById('search').oninput=render;document.getElementById('status').onchange=render;
</script></body></html>
