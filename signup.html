<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Thebes AI Growth Program</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="container nav-inner"><a href="/"><img class="logo" src="/assets/thebes-logo.png" alt="Thebes Ads"></a><nav class="nav-links"><a href="/">Program</a><a href="/login.html">Log In</a></nav></div></header><main class="auth-shell"><section class="glass auth-card"><h1>Create your account</h1><p>Join Thebes AI Growth Program.</p><div class="error"></div><div class="success"></div><form id="signupForm"><div class="form-grid"><div class="field"><label>Full name</label><input class="input" name="full_name" required></div><div class="field"><label>Company name</label><input class="input" name="company_name" required></div></div><div class="field"><label>Work email</label><input class="input" type="email" name="email" required></div><div class="field"><label>Country</label><input class="input" name="country" placeholder="e.g. Singapore" required></div><div class="field"><label>Password</label><input class="input" type="password" name="password" minlength="8" required></div><label class="check"><input type="checkbox" required><span>I agree to the Terms of Service and Privacy Policy and confirm that the information I submit is accurate.</span></label><button class="btn btn-primary full">Create Account</button></form><p style="margin-top:20px;text-align:center">Already have an account? <a href="/login.html" style="color:var(--gold)">Log in</a></p></section></main><script src="/config.js"></script><script src="/app.js"></script><script>
document.getElementById('signupForm').addEventListener('submit', async e=>{e.preventDefault(); const f=Object.fromEntries(new FormData(e.target)); try{await Thebes.api('/auth/signup.php',{method:'POST',body:JSON.stringify(f)}); location.href='/dashboard.html';}catch(err){Thebes.showMessage('error',err.message)}})
</script></body></html>
