<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Thebes AI Growth Program</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="container nav-inner"><a href="/"><img class="logo" src="/assets/thebes-logo.png" alt="Thebes Ads"></a><nav class="nav-links"><a href="/">Program</a><a href="/login.html">Log In</a></nav></div></header><main class="auth-shell"><section class="glass auth-card"><h1>Create your account</h1><p>Join Thebes AI Growth Program.</p><div class="error"></div><div class="success"></div><div id="verificationBox" class="verification-box" hidden></div><form id="signupForm"><div class="form-grid"><div class="field"><label>Full name</label><input class="input" name="full_name" autocomplete="name" required></div><div class="field"><label>Company name</label><input class="input" name="company_name" autocomplete="organization" required></div></div><div class="field"><label>Work email</label><input class="input" type="email" name="email" autocomplete="email" placeholder="name@company.com" required></div><div class="field-note">Please use your company email address. Gmail, Yahoo, Outlook and other generic email providers are not accepted.</div><div class="field"><label>Country</label><select class="select" name="country" id="country" required><option value="">Select your country</option></select></div><div class="field"><label>Password</label><input class="input" type="password" name="password" minlength="8" autocomplete="new-password" required></div><label class="check"><input type="checkbox" required><span>I agree to the Terms of Service and Privacy Policy and confirm that the information I submit is accurate.</span></label><button class="btn btn-primary full" type="submit">Create Account</button></form><p style="margin-top:20px;text-align:center">Already have an account? <a href="/login.html" style="color:var(--gold)">Log in</a></p></section></main><script src="/config.js"></script><script src="/app.js"></script><script>
const countries = ['Afghanistan','Albania','Algeria','Andorra','Angola','Antigua and Barbuda','Argentina','Armenia','Australia','Austria','Azerbaijan','Bahamas','Bahrain','Bangladesh','Barbados','Belarus','Belgium','Belize','Benin','Bhutan','Bolivia','Bosnia and Herzegovina','Botswana','Brazil','Brunei','Bulgaria','Burkina Faso','Burundi','Cabo Verde','Cambodia','Cameroon','Canada','Central African Republic','Chad','Chile','China','Colombia','Comoros','Congo (Democratic Republic)','Congo (Republic)','Costa Rica','Cote d’Ivoire','Croatia','Cuba','Cyprus','Czechia','Denmark','Djibouti','Dominica','Dominican Republic','Ecuador','Egypt','El Salvador','Equatorial Guinea','Eritrea','Estonia','Eswatini','Ethiopia','Fiji','Finland','France','Gabon','Gambia','Georgia','Germany','Ghana','Greece','Grenada','Guatemala','Guinea','Guinea-Bissau','Guyana','Haiti','Honduras','Hong Kong','Hungary','Iceland','India','Indonesia','Iran','Iraq','Ireland','Israel','Italy','Jamaica','Japan','Jordan','Kazakhstan','Kenya','Kiribati','Kuwait','Kyrgyzstan','Laos','Latvia','Lebanon','Lesotho','Liberia','Libya','Liechtenstein','Lithuania','Luxembourg','Macao','Madagascar','Malawi','Malaysia','Maldives','Mali','Malta','Marshall Islands','Mauritania','Mauritius','Mexico','Micronesia','Moldova','Monaco','Mongolia','Montenegro','Morocco','Mozambique','Myanmar','Namibia','Nauru','Nepal','Netherlands','New Zealand','Nicaragua','Niger','Nigeria','North Korea','North Macedonia','Norway','Oman','Pakistan','Palau','Palestine','Panama','Papua New Guinea','Paraguay','Peru','Philippines','Poland','Portugal','Qatar','Romania','Russia','Rwanda','Saint Kitts and Nevis','Saint Lucia','Saint Vincent and the Grenadines','Samoa','San Marino','Sao Tome and Principe','Saudi Arabia','Senegal','Serbia','Seychelles','Sierra Leone','Singapore','Slovakia','Slovenia','Solomon Islands','Somalia','South Africa','South Korea','South Sudan','Spain','Sri Lanka','Sudan','Suriname','Sweden','Switzerland','Syria','Taiwan','Tajikistan','Tanzania','Thailand','Timor-Leste','Togo','Tonga','Trinidad and Tobago','Tunisia','Turkey','Turkmenistan','Tuvalu','Uganda','Ukraine','United Arab Emirates','United Kingdom','United States','Uruguay','Uzbekistan','Vanuatu','Vatican City','Venezuela','Vietnam','Yemen','Zambia','Zimbabwe'];
const country = document.getElementById('country');
countries.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;country.appendChild(o)});
document.getElementById('signupForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=e.submitter; const f=Object.fromEntries(new FormData(e.target));
  if(!Thebes.isCompanyEmail(f.email)){Thebes.showMessage('error','Please use your company work email. Generic email providers such as Gmail, Yahoo and Outlook are not accepted.');return;}
  btn.disabled=true;btn.textContent='Creating account…';
  try{
    const d=await Thebes.api('/auth/signup.php',{method:'POST',body:JSON.stringify(f)});
    e.target.hidden=true;
    const box=document.getElementById('verificationBox');box.hidden=false;
    box.innerHTML='<strong>Check your work email.</strong><br>We sent a verification link to '+Thebes.escapeHtml(f.email)+'. You must verify your email before you can sign in and access the developer portal.';
  }catch(err){Thebes.showMessage('error',err.message);btn.disabled=false;btn.textContent='Create Account';}
});
</script></body></html>
