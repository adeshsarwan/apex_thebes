<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application · Thebes Ads</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="container nav-inner"><a href="/"><img class="logo" src="/assets/thebes-logo.png"></a><nav class="nav-links"><span data-user-name></span><button class="btn btn-outline" onclick="Thebes.logout()">Log out</button></nav></div></header><div class="app-layout"><aside class="sidebar"><div class="side-label">DEVELOPER PORTAL</div><a class="side-link active" href="/dashboard.html">▣ My Applications</a><a class="side-link" href="/apply.html">＋ New Application</a></aside><main class="main"><div id="success" class="success"></div><div class="page-head"><div><h1 id="title">Application</h1><p>Submission details and current review status.</p></div><a class="btn btn-ghost" href="/dashboard.html">← My Applications</a></div><section class="glass card" id="detail"></section></main></div><script src="/config.js"></script><script src="/app.js"></script><script>
(async()=>{await Thebes.requireUser('developer');const id=new URLSearchParams(location.search).get('id');const d=await Thebes.api('/applications/detail.php?id='+encodeURIComponent(id));const a=d.application;document.getElementById('title').textContent=a.app_name; if(new URLSearchParams(location.search).get('submitted')){const s=document.getElementById('success');s.textContent='Application submitted successfully. A confirmation email has been sent.';s.classList.add('show')} document.getElementById('detail').innerHTML=`<div style="display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px"><div><div class="hint">CURRENT STATUS</div><span class="badge ${Thebes.statusClass(a.status)}">${Thebes.escapeHtml(a.status)}</span></div><div class="hint">Submitted ${new Date(a.submitted_at||a.created_at).toLocaleString()}</div></div><div class="detail-list"><div class="detail"><small>Platform</small><strong>${Thebes.escapeHtml(a.platform)}</strong></div><div class="detail"><small>Category</small><strong>${Thebes.escapeHtml(a.category)}</strong></div><div class="detail"><small>Store URL</small><strong><a style="color:var(--gold)" target="_blank" href="${Thebes.escapeHtml(a.store_url)}">Open store listing ↗</a></strong></div><div class="detail"><small>Package / Bundle</small><strong>${Thebes.escapeHtml(a.package_name||'—')}</strong></div><div class="detail"><small>Monthly active users</small><strong>${Thebes.escapeHtml(a.mau||'—')}</strong></div><div class="detail"><small>Monthly installs</small><strong>${Thebes.escapeHtml(a.monthly_installs||'—')}</strong></div><div class="detail"><small>Business model</small><strong>${Thebes.escapeHtml(a.business_model||'—')}</strong></div><div class="detail"><small>Paid UA</small><strong>${Thebes.escapeHtml(a.paid_ua||'—')}</strong></div></div><div class="detail"><small>Description</small><strong>${Thebes.escapeHtml(a.description)}</strong></div><div class="detail"><small>How AI is used</small><strong>${Thebes.escapeHtml(a.ai_usage)}</strong></div>`})().catch(console.error)
</script></body></html>
