<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Application · Thebes Ads</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="container nav-inner"><a href="/"><img class="logo" src="/assets/thebes-logo.png"></a><nav class="nav-links"><span data-user-name></span><button class="btn btn-outline" onclick="Thebes.logout()">Log out</button></nav></div></header><div class="app-layout"><aside class="sidebar"><div class="side-label">ADMIN PANEL</div><a class="side-link active" href="/admin.html">▣ Applications</a></aside><main class="main"><div class="page-head"><div><h1 id="title">Review Application</h1><p>Developer submission and internal review controls.</p></div><a class="btn btn-ghost" href="/admin.html">← Applications</a></div><div class="success"></div><div class="error"></div><div class="review-panel"><section class="glass card" id="detail"></section><aside class="glass card"><h2 style="margin-top:0">Thebes Review</h2><div class="field"><label>Status</label><select id="reviewStatus" class="select"><option>Submitted</option><option>Under Review</option><option>More Info</option><option>Selected</option><option>Not Selected</option></select></div><div class="field"><label>Internal notes</label><textarea id="notes" class="textarea" placeholder="Visible only to Thebes"></textarea></div><button class="btn btn-primary full" id="save">Save Review</button><p class="hint">Changing status to <b>Selected</b> sends the developer a selection email automatically.</p></aside></div></main></div><script src="/config.js"></script><script src="/app.js"></script><script>
let app;const id=new URLSearchParams(location.search).get('id');async function load(){await Thebes.requireUser('admin');const d=await Thebes.api('/admin/applications/detail.php?id='+encodeURIComponent(id));app=d.application;document.getElementById('title').textContent=app.app_name;document.getElementById('reviewStatus').value=app.status;document.getElementById('notes').value=app.internal_notes||'';document.getElementById('detail').innerHTML=`<h2 style="margin-top:0">${Thebes.escapeHtml(app.app_name)}</h2><div class="detail-list"><div class="detail"><small>Developer</small><strong>${Thebes.escapeHtml(app.full_name)} · ${Thebes.escapeHtml(app.company_name)}</strong></div><div class="detail"><small>Email</small><strong>${Thebes.escapeHtml(app.email)}</strong></div><div class="detail"><small>Platform</small><strong>${Thebes.escapeHtml(app.platform)}</strong></div><div class="detail"><small>Category</small><strong>${Thebes.escapeHtml(app.category)}</strong></div><div class="detail"><small>Store</small><strong><a style="color:var(--gold)" target="_blank" href="${Thebes.escapeHtml(app.store_url)}">Open listing ↗</a></strong></div><div class="detail"><small>Package</small><strong>${Thebes.escapeHtml(app.package_name||'—')}</strong></div><div class="detail"><small>MAU</small><strong>${Thebes.escapeHtml(app.mau||'—')}</strong></div><div class="detail"><small>Monthly installs</small><strong>${Thebes.escapeHtml(app.monthly_installs||'—')}</strong></div><div class="detail"><small>Business model</small><strong>${Thebes.escapeHtml(app.business_model||'—')}</strong></div><div class="detail"><small>UA spend</small><strong>${Thebes.escapeHtml(app.ua_spend||'—')}</strong></div></div><div class="detail"><small>Description</small><strong>${Thebes.escapeHtml(app.description)}</strong></div><div class="detail"><small>How AI is used</small><strong>${Thebes.escapeHtml(app.ai_usage)}</strong></div><div class="detail"><small>Additional info</small><strong>${Thebes.escapeHtml(app.additional_info||'—')}</strong></div>`}
document.getElementById('save').onclick=async()=>{const b=document.getElementById('save');b.disabled=true;try{await Thebes.api('/admin/applications/detail.php?id='+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:document.getElementById('reviewStatus').value,internal_notes:document.getElementById('notes').value})});Thebes.showMessage('success','Review saved. Developer email sent if this was a new selection.');await load()}catch(e){Thebes.showMessage('error',e.message)}finally{b.disabled=false}};load();
</script></body></html>
