<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · Thebes AI Growth Program</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="container nav-inner"><a href="/"><img class="logo" src="/assets/thebes-logo.png" alt="Thebes Ads"></a><nav class="nav-links"><a href="/">Program</a><a href="/signup.html" class="btn btn-primary">Submit Your App</a></nav></div></header><main class="auth-shell"><section class="glass auth-card"><h1>Welcome back</h1><p>Access your Thebes AI Growth Program account.</p><div class="error"></div><div class="success"></div><form id="loginForm"><div class="field"><label>Email address</label><input class="input" type="email" name="email" autocomplete="email" required></div><div class="field"><label>Password</label><input class="input" type="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary full">Continue</button></form><p style="margin-top:20px;text-align:center">New developer? <a href="/signup.html" style="color:var(--gold)">Create an account</a></p></section></main><script src="/config.js"></script><script src="/app.js"></script><script>
const qs=new URLSearchParams(location.search);if(qs.get('verified')==='1')Thebes.showMessage('success','Email verified successfully. You can now sign in.');
document.getElementById('loginForm').addEventListener('submit', async e=>{e.preventDefault(); const btn=e.submitter;const f=Object.fromEntries(new FormData(e.target));btn.disabled=true;try{const d=await Thebes.api('/auth/login.php',{method:'POST',body:JSON.stringify(f)}); location.href=d.user.role==='admin'?'/admin.html':'/dashboard.html';}catch(err){Thebes.showMessage('error',err.message);btn.disabled=false;}})
</script></body></html>
