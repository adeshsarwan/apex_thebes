<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer · Thebes AI Growth Program</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="container nav-inner"><a href="/"><img class="logo" src="/assets/thebes-logo.png" alt="Thebes Ads"></a><nav class="nav-links"><span>Admin · <b data-user-name></b></span><button class="btn btn-outline" onclick="Thebes.logout()">Log out</button></nav></div></header><div class="app-layout"><aside class="sidebar"><div class="side-label">ADMIN PANEL</div><a class="side-link" href="/admin.html">▣ Applications</a><a class="side-link active" href="/admin-developers.html">◉ Developers</a><a class="side-link" href="/">⌂ Public Program</a></aside><main class="main"><div class="page-head"><div><h1 id="developerTitle">Developer</h1><p>Developer account, company and application history.</p></div><a class="btn btn-ghost" href="/admin-developers.html">← Developers</a></div><div class="success"></div><div class="error"></div><div class="developer-detail-grid"><section class="glass card"><div id="profile"></div></section><aside class="glass card"><h2 style="margin-top:0">Account</h2><div id="accountStatus"></div><button id="resend" class="btn btn-primary full" style="display:none">Resend Verification Email</button></aside></div><section class="glass card" style="margin-top:18px"><h2 style="margin-top:0">Applications</h2><div class="table-wrap"><table class="table"><thead><tr><th>App</th><th>Platform</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead><tbody id="apps"></tbody></table></div></section></main></div><script src="/config.js"></script><script src="/app.js"></script><script>
const id=new URLSearchParams(location.search).get('id');let developer;
function fmt(v){return v?new Date(v).toLocaleString():'—'}
async function load(){await Thebes.requireUser('admin');const d=await Thebes.api('/admin/developers/detail.php?id='+encodeURIComponent(id));developer=d.developer;document.getElementById('developerTitle').textContent=developer.full_name||developer.email;document.getElementById('profile').innerHTML=`<h2 style="margin-top:0">${Thebes.escapeHtml(developer.full_name||'—')}</h2><div class="detail-list"><div class="detail"><small>Company</small><strong>${Thebes.escapeHtml(developer.company_name||'—')}</strong></div><div class="detail"><small>Work email</small><strong>${Thebes.escapeHtml(developer.email)}</strong></div><div class="detail"><small>Country</small><strong>${Thebes.escapeHtml(developer.country||'—')}</strong></div><div class="detail"><small>Joined</small><strong>${fmt(developer.created_at)}</strong></div><div class="detail"><small>Email verified</small><strong>${fmt(developer.email_verified_at)}</strong></div><div class="detail"><small>Last login</small><strong>${fmt(developer.last_login_at)}</strong></div><div class="detail"><small>Signup IP</small><strong>${Thebes.escapeHtml(developer.signup_ip||'—')}</strong></div><div class="detail"><small>Account status</small><strong>${Thebes.escapeHtml(developer.account_status||'Active')}</strong></div></div>`;document.getElementById('accountStatus').innerHTML=developer.email_verified_at?'<div class="account-state good"><span class="badge verified">Verified</span><p>This developer has verified their company email.</p></div>':'<div class="account-state warn"><span class="badge pending">Pending verification</span><p>This developer has not yet verified their company email.</p></div>';const resend=document.getElementById('resend');resend.style.display=developer.email_verified_at?'none':'inline-flex';document.getElementById('apps').innerHTML=(d.applications||[]).length?(d.applications||[]).map(a=>`<tr><td><strong>${Thebes.escapeHtml(a.app_name)}</strong></td><td>${Thebes.escapeHtml(a.platform)}</td><td><span class="badge ${Thebes.statusClass(a.status)}">${Thebes.escapeHtml(a.status)}</span></td><td>${new Date(a.submitted_at||a.created_at).toLocaleDateString()}</td><td><a class="btn btn-ghost btn-small" href="/admin-application.html?id=${a.id}">Review</a></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty compact">No applications submitted yet.</div></td></tr>'}
document.getElementById('resend').onclick=async()=>{const b=document.getElementById('resend');b.disabled=true;b.textContent='Sending…';try{await Thebes.api('/admin/developers/resend-verification.php',{method:'POST',body:JSON.stringify({user_id:Number(id)})});Thebes.showMessage('success','Verification email resent successfully.')}catch(e){Thebes.showMessage('error',e.message)}finally{b.disabled=false;b.textContent='Resend Verification Email'}};load();
</script></body></html>
