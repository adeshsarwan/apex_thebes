<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Applications · Thebes Ads</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="container nav-inner"><a href="/"><img class="logo" src="/assets/thebes-logo.png" alt="Thebes Ads"></a><nav class="nav-links"><span data-user-name></span><button class="btn btn-outline" onclick="Thebes.logout()">Log out</button></nav></div></header><div class="app-layout"><aside class="sidebar"><div class="side-label">DEVELOPER PORTAL</div><a class="side-link active" href="/dashboard.html">▣ My Applications</a><a class="side-link" href="/apply.html">＋ New Application</a><a class="side-link" href="/">⌂ Program</a></aside><main class="main"><div class="page-head"><div><h1>My Applications</h1><p>Manage and track your AI app submissions.</p></div><a class="btn btn-primary" href="/apply.html">＋ New Application</a></div><div class="glass card"><div class="tabs"><span class="tab active">All Applications</span></div><div class="table-wrap"><table class="table"><thead><tr><th>App Name</th><th>Platform</th><th>Submitted On</th><th>Status</th><th>Action</th></tr></thead><tbody id="apps"></tbody></table><div class="empty" id="empty" style="display:none">No applications yet.<br><br><a class="btn btn-primary" href="/apply.html">Submit your first app</a></div></div></div></main></div><script src="/config.js"></script><script src="/app.js"></script><script>
(async()=>{await Thebes.requireUser('developer'); const data=await Thebes.api('/applications/index.php'); const tbody=document.getElementById('apps'); if(!data.applications.length){document.getElementById('empty').style.display='block';return;} tbody.innerHTML=data.applications.map(a=>`<tr><td><strong>${Thebes.escapeHtml(a.app_name)}</strong><div class="hint">${Thebes.escapeHtml(a.package_name||'')}</div></td><td>${Thebes.escapeHtml(a.platform)}</td><td>${new Date(a.submitted_at||a.created_at).toLocaleDateString()}</td><td><span class="badge ${Thebes.statusClass(a.status)}">${Thebes.escapeHtml(a.status)}</span></td><td><a class="btn btn-ghost" href="/application.html?id=${a.id}">View</a></td></tr>`).join('')})().catch(console.error)
</script></body></html>
